<style>

.tt{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;color:#14532d;line-height:1.2}

.logo{width:44px;height:44px;border-radius:14px;background:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 4px 12px rgba(20,80,50,.18);flex:none}

.box .it{box-shadow:none;background:#f7fbf8}
.db{width:56px;border-radius:14px;background:#fff;border:1px solid #f3c5c0;overflow:hidden;text-align:center;flex:none;font-weight:700}

.t-Morning{background:#fff1b8;color:#8a6100}.t-Afternoon{background:#ffd9b0;color:#a14a00}.t-Evening{background:#ffd1e3;color:#a3154f}.t-Night{background:#d9dcff;color:#2d2f9c}.t-x{background:#e8d9ff;color:#5b1fb0}
.ib{width:34px;height:34px;border-radius:50%;border:0;background:#e3f4e9;font-size:16px}

.hd{background:var(--o);color:#fff;border-radius:22px;text-align:center;padding:20px 16px;margin-bottom:12px;box-shadow:0 8px 20px rgba(10,90,58,.3)}
.hd .e{font-size:38px}.hd .id{font-size:22px;font-weight:800;color:#fff3b0;margin:4px 0 8px}
.rw{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #edf4ee}.rw:last-child{border:0}
.rw .ic{font-size:24px;width:34px;text-align:center}.rw div{flex:1;min-width:0}.rw small{display:block;color:var(--mut);font-size:12px}.rw b{font-size:15px;word-break:break-word}
.rw a{text-decoration:none;color:#fff}.rw a.bt{flex:none;padding:9px 12px}
.row{display:flex;gap:10px;margin:14px 0}
.mn{display:flex;width:100%;align-items:center;gap:12px;background:none;border:0;border-bottom:1px solid #edf4ee;padding:14px 4px;font:600 15px inherit;font-family:inherit;color:var(--ink);text-align:left}
.mn:last-child{border:0}.mn i{font-style:normal;font-size:20px;width:30px}.mn span{flex:1}
.prof{text-align:center}.bigav{width:84px;height:84px;margin:0 auto 8px;border-radius:50%;background:var(--o);display:grid;place-items:center;font-size:36px;font-weight:800;color:#fff;box-shadow:0 6px 18px rgba(13,122,78,.45)}
.sw{width:46px;height:26px;border-radius:20px;border:0;background:#cfd8d2;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}.sw.on{background:#25a86b}.sw.on::after{left:23px}
.add{display:flex;gap:8px;margin-top:10px}.add input{flex:1;padding:10px;border:1.5px solid var(--line);border-radius:12px;font:14px inherit;font-family:inherit}.add .bt{flex:none;padding:10px 16px}
.donut{width:150px;height:150px;border-radius:50%;margin:8px auto;display:grid;place-items:center}
.donut div{width:94px;height:94px;border-radius:50%;background:#fff;display:grid;place-content:center;text-align:center;font-size:12px;color:var(--mut)}.donut b{font-size:26px;color:var(--ink);line-height:1}
.lg{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0}.lg i{width:12px;height:12px;border-radius:50%}.lg span{flex:1}
.bar{height:10px;border-radius:10px;background:#e8f1ea;margin:4px 0 10px;overflow:hidden}.bar div{height:100%;border-radius:10px;background:var(--o)}
.dts{display:flex;gap:8px;align-items:center}.dts input{flex:1;padding:11px;border:1px solid var(--line);border-radius:12px;font:14px inherit;font-family:inherit;color:var(--ink);background:#fff}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
nav{position:fixed;left:8px;right:8px;bottom:calc(6px + env(safe-area-inset-bottom));max-width:584px;margin:auto;background:#fff;display:flex;padding:7px 6px;border-radius:28px;z-index:5;box-shadow:0 8px 24px rgba(20,80,50,.28);border:1px solid var(--line)}
nav button{flex:1;background:none;border:0;color:#3d5446;font:600 11px inherit;font-family:inherit;display:grid;justify-items:center;gap:2px;padding:7px 0;border-radius:22px;margin:0 2px}
nav button span{font-size:21px}nav button.on{background:var(--o);color:#fff;box-shadow:0 4px 12px rgba(13,122,78,.45)}
.sheet{position:fixed;inset:0;background:rgba(10,40,25,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}.sheet.show{display:flex}
.panel{background:#fbfdf9;color:var(--ink);width:100%;max-width:560px;max-height:93vh;overflow:auto;border-radius:24px 24px 0 0;padding:0 16px calc(20px + env(safe-area-inset-bottom))}
.ph{margin:0 -16px;padding:16px;background:var(--o);color:#fff;display:flex;justify-content:space-between;align-items:center}.ph h2{margin:0;font-size:18px}
.f label{display:block;font-weight:600;font-size:14px;margin:14px 0 5px}
.f input,.f select,.f textarea{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:14px;font:15px inherit;font-family:inherit;background:#fff;color:var(--ink)}
.f input:focus,.f select:focus,.f textarea:focus,.add input:focus,.sr input:focus{outline:0;box-shadow:0 0 0 3px rgba(37,168,107,.35)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tl{border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:center;font:600 14px inherit;font-family:inherit;background:#fff;color:var(--ink)}
.tl.on{background:var(--o);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(13,122,78,.4)}
.drop{border:2px dashed #25a86b;background:#eefaf2;border-radius:16px;padding:16px;text-align:center;color:var(--mut);font-size:12px;display:block}.drop b{display:block;color:var(--ink);font-size:15px}
.save{width:100%;background:var(--o);color:#fff;border:0;border-radius:14px;padding:15px;font:700 16px inherit;font-family:inherit;margin-top:18px;box-shadow:0 6px 16px rgba(13,122,78,.4)}.save:disabled{opacity:.6}
.cancel{width:100%;background:none;border:0;color:var(--mut);padding:12px;font:600 14px inherit;font-family:inherit}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom));background:#14532d;color:#fff;padding:11px 18px;border-radius:24px;z-index:30;display:none;font-size:14px;font-weight:600;max-width:90%;box-shadow:0 6px 20px rgba(0,0,0,.35)}#toast.err{background:#b3261e}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes pop{0%{opacity:0;transform:scale(.85)}70%{transform:scale(1.04)}100%{opacity:1;transform:none}}@keyframes up{from{transform:translateY(100%)}to{transform:none}}@keyframes glow{0%,100%{box-shadow:0 6px 18px rgba(13,122,78,.45)}50%{box-shadow:0 6px 28px rgba(37,168,107,.9)}}
.it,.box,.ban,.sr,.chips,.hd{animation:rise .45s both}.tile{animation:pop .5s both}.g2>:nth-child(2),.g4>:nth-child(2){animation-delay:.08s}.g2>:nth-child(3),.g4>:nth-child(3){animation-delay:.16s}.g2>:nth-child(4),.g4>:nth-child(4){animation-delay:.24s}
.sheet.show .panel{animation:up .35s cubic-bezier(.2,.8,.2,1)}.fab{animation:glow 3s infinite}
.tile:active,.bt:active,.qa:active,.it:active,.save:active,.ch:active{transform:scale(.96)}.tile,.bt,.qa,.it,.save{transition:transform .15s}
@media print{body{background:#fff}#top,nav,.noprint{display:none!important}.box{box-shadow:none;border:1px solid #ccc}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}

<script>

const API = 'https://script.google.com/macros/s/AKfycbz6we0ym3_QNyJGVj-9pNPumVWpruOi3w-zopQKysLzrO7J17UOWDe9qCU_RtHuwmV8/exec';

const iso = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const today = () => iso(new Date());
const fmt = d => { const t = new Date(d + 'T00:00:00'); return isNaN(t) ? esc(d) : t.toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}); };

let D = {poojai: [], silai: []}, opt = JSON.parse(JSON.stringify(DEF)), loaded = false, U = JSON.parse(localStorage.getItem('usr') || 'null');
let page = 'home', arg = null, hist = [], flt = {poojai: 'All', silai: 'All'}, q = '', ADM = null, counted = false;

async function api(b) {
  if (U) b.token = U.token;
  const j = await (await fetch(API, {method: 'POST', body: JSON.stringify(b)})).json();
  if (j.auth) { U = null; localStorage.removeItem('usr'); render(); }
  if (!j.ok) throw new Error(j.error || 'Error');

}
async function load() {
  try {
    const j = await (await fetch(API)).json();
    if (!j.ok) throw new Error(j.error);
    if (!('opt' in j)) toast('⚠️ Apps Script is old. Deploy a New version', true);
    D = {poojai: j.poojai, silai: j.silai}; const nd = s => { s = String(s || ''); if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s; const t = new Date(s); return isNaN(t) ? s : iso(t); };
    D.poojai.forEach(r => { r.date = nd(r.date); r.status = r.status || 'Scheduled'; }); D.silai.forEach(r => { r.bookingDate = nd(r.bookingDate); r.status = r.status || 'Pending'; });
    if (j.opt) for (const k in DEF) if (j.opt[k]) opt[k] = j.opt[k];
    loaded = true; render();
  } catch (e) { console.error(e); toast('⚠️ Could not load data: ' + e.message, true); }
}

}

function go(p, a) { if (TABS.includes(p)) hist = []; else hist.push({page, arg, q}); page = p; arg = a; q = ''; if (p === 'users' || p === 'log') ADM = null; render(); scrollTo(0, 0); }
function back() { const h = hist.pop() || {page: 'home'}; page = h.page; arg = h.arg || null; q = h.q || ''; render(); }

function fillRows() {
  const box = $('rows'); if (!box) return;
  if (!loaded) { box.innerHTML = '<div class="empty">⏳ Loading...</div>'; return; }
  const s = q.trim().toLowerCase(), f = flt[page], t = today(), p = page === 'poojai';
  let rows = D[page].filter(r => !s || Object.values(r).join(' ').toLowerCase().includes(s));
  if (p) {
    if (f === 'Today') rows = rows.filter(r => r.date === t); else if (f === 'Upcoming') rows = rows.filter(r => r.date >= t); else if (f !== 'All') rows = rows.filter(r => r.timing === f);
    rows.sort((a, b) => f === 'Upcoming' ? a.date.localeCompare(b.date) : b.date.localeCompare(a.date));
  } else { if (f !== 'All') rows = rows.filter(r => r.status === f); rows.sort((a, b) => b.bookingDate.localeCompare(a.bookingDate) || b.id.localeCompare(a.id)); }
  box.innerHTML = rows.map(p ? pItem : sItem).join('') || empty;

function vReports() {
  const P = D.poojai.filter(r => r.date >= R.from && r.date <= R.to), B = D.silai.filter(r => r.bookingDate >= R.from && r.bookingDate <= R.to);
  const col = ['#ff9a1f', '#ec4899', '#5b3df5', '#0ea5e9', '#19c37d', '#a855f7'], T = opt.timing.map(x => x[0]), cnt = T.map(t => P.filter(r => r.timing === t).length), tot = P.length;
  let a = 0; const st = tot ? cnt.map((c, i) => { const s = a; a += c / tot * 100; return `${col[i % 6]} ${s}% ${a}%`; }).join(',') : '#efe6f8 0 100%';
  const bs = on('bstatus'), bc = bs.map(s => B.filter(r => r.status === s).length), mx = Math.max(1, ...bc);
  return `<h2 class="h2">📊 Reports</h2><div class="dts noprint"><input type="date" value="${R.from}" onchange="R.from=this.value;render()"><span>→</span><input type="date" value="${R.to}" onchange="R.to=this.value;render()"></div>
  <div class="g2" style="margin-top:12px">${tile('o','calheart',P.length,'Poojai','void 0')}${tile('b','temple',B.length,'Bookings','void 0')}${tile('g','calcheck',B.filter(r => r.status === 'Completed').length,'Completed','void 0')}${tile('p','hour',B.filter(r => r.status === 'Pending').length,'Pending','void 0')}</div>

  <div class="row noprint"><button class="bt g" onclick="exportCSV()">📗 Export Excel</button><button class="bt r" onclick="print()">📕 Export PDF</button></div>`;

function exportCSV() {
  const c = v => '"' + String(v ?? '').replace(/"/g, '""') + '"', P = D.poojai.filter(r => r.date >= R.from && r.date <= R.to), B = D.silai.filter(r => r.bookingDate >= R.from && r.bookingDate <= R.to);
  const s = 'POOJAI\nID,Date,Location,Timing,Guru,Status\n' + P.map(r => [r.id, r.date, r.location, r.timing, r.guru, r.status].map(c).join(',')).join('\n')
    + '\n\nSILAI BOOKINGS\nID,Booking Date,Name,Location,Address,Phone,Proof Type,Proof Number,Status\n' + B.map(r => [r.id, r.bookingDate, r.name, r.location, r.address, r.phone, r.proofType, r.proofNo, r.status].map(c).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + s], {type: 'text/csv'})); a.download = `seva-report-${R.from}_to_${R.to}.csv`; a.click();
}

// ---------- auth ----------
function showSheet(h) { $('panel').innerHTML = h; $('sheet').classList.add('show'); }
function hide() { $('sheet').classList.remove('show'); }
$('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') hide(); });
function login() {
  showSheet(`<div class="ph"><h2>🔒 Login</h2></div><div class="f"><label>Name (leave blank for Admin)</label><input id="ln" placeholder="Admin" autocapitalize="off" autocomplete="off">
  <label>Password</label><input id="pw" type="password" autocapitalize="characters" onkeydown="if(event.key==='Enter')doLogin()"><button class="save" onclick="doLogin()">Login</button><button class="cancel" onclick="hide()">Cancel</button></div>`);
  setTimeout(() => $('pw').focus(), 150);
}
async function doLogin() {
  try { const j = await api({action: 'login', name: $('ln').value, password: $('pw').value}); U = {name: j.name || 'Admin', role: j.role || 'Admin', token: j.token}; localStorage.setItem('usr', JSON.stringify(U)); hide(); toast('✅ Welcome ' + j.name); render(); }
  catch (e) { toast('❌ ' + e.message, true); }
}
function logout() { U = null; ADM = null; localStorage.removeItem('usr'); toast('Logged out'); go('home'); }
function add(t) { if (!canEdit()) { login(); return; } openForm(t); }

// ---------- forms ----------
const sel = (k, cur, ph) => `<option value="">${ph}</option>` + on(k).concat(cur && !on(k).includes(cur) ? [cur] : []).map(x => `<option ${x === cur ? 'selected' : ''}>${esc(x)}</option>`).join('');
const fl = (r, k, l, ph, type = 'text', ex = '') => `<label>${l} *</label><input id="f_${k}" type="${type}" placeholder="${ph}" value="${esc(r[k] || '')}" ${ex}>`;
function pick(el, v) { $('f_timing').value = v; document.querySelectorAll('.tl').forEach(b => b.classList.toggle('on', b === el)); }
function openForm(type, id) {
  const r = id ? D[type].find(x => x.id === id) : {}, p = type === 'poojai'; let h;
  if (p) h = `<div class="ph"><h2>🪔 ${id ? 'Edit' : 'Add New'} Poojai</h2></div><div class="f">${fl(r, 'date', 'Poojai Date', '', 'date')}${fl(r, 'location', 'Location', 'Enter location')}
    <label>Timing *</label><input type="hidden" id="f_timing" value="${esc(r.timing || '')}"><div class="tiles">${on('timing').map(t => `<button type="button" class="tl ${r.timing === t ? 'on' : ''}" onclick="pick(this,'${esc(t)}')">${TI[t] || '🕐'} ${esc(t)}</button>`).join('')}</div>
    ${fl(r, 'guru', 'Guru Name', 'Enter Guru name')}<label>Status</label><select id="f_status">${sel('pstatus', r.status || 'Scheduled', 'Select status')}</select>`;
  else h = `<div class="ph" style="background:var(--p)"><h2>📖 ${id ? 'Edit' : 'New'} Silai Booking</h2></div><div class="f">${fl(r, 'bookingDate', 'Booking Date', '', 'date')}${fl(r, 'name', 'Name', 'Enter person name')}${fl(r, 'location', 'Location', 'Enter location')}
    <label>Address Details *</label><textarea id="f_address" rows="2" placeholder="Enter complete address">${esc(r.address || '')}</textarea>${fl(r, 'phone', 'Phone Number', 'Enter 10-digit mobile number', 'tel', 'inputmode="numeric" maxlength="10"')}
    <label>Proof Type *</label><select id="f_proofType">${sel('proof', r.proofType, 'Select proof type')}</select>
    <label>Proof Number</label><input id="f_proofNo" inputmode="numeric" placeholder="Aadhar / Ration card number" value="${esc(r.proofNo || '')}">
    <label>Status</label><select id="f_status">${sel('bstatus', r.status || 'Pending', 'Select status')}</select>
    <label>Proof Document (Optional)</label><label class="drop"><input type="file" id="f_file" accept=".pdf,.jpg,.jpeg,.png" hidden onchange="$('fn').textContent=this.files[0]?'✅ '+this.files[0].name:''">☁️<b>Upload File (PDF / JPG / PNG)</b>Max 5 MB · You can skip this step<div id="fn" style="color:#0b7a4b;font-weight:600;margin-top:4px"></div></label>`;
  showSheet(h + `<button class="save" id="sv" onclick="save('${type}','${id || ''}')">✔ Save ${p ? 'Poojai' : 'Booking'}</button><button class="cancel" onclick="hide()">Cancel</button></div>`);
  if (!id) $('f_' + (p ? 'date' : 'bookingDate')).value = today();
}
const b64 = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.onerror = no; r.readAsDataURL(f); });
async function save(type, id) {
  const p = type === 'poojai', ks = p ? ['date', 'location', 'timing', 'guru', 'status'] : ['bookingDate', 'name', 'location', 'address', 'phone', 'proofType', 'proofNo', 'status'], d = {};
  ks.forEach(k => d[k] = $('f_' + k).value.trim()); if (id) d.id = id;
  const need = p ? ['date', 'location', 'timing', 'guru'] : ['bookingDate', 'name', 'location', 'address', 'phone', 'proofType'];
  if (need.some(k => !d[k])) return toast('❌ Please fill all required (*) fields', true);
  if (!p && !/^\d{10}$/.test(d.phone)) return toast('❌ Phone must be 10 digits', true);
  if (!p && !id && D.silai.some(r => r.phone === d.phone && r.bookingDate === d.bookingDate) && !confirm('A booking with this phone and date already exists. Save anyway?')) return;
  const b = $('sv'); b.disabled = true; b.textContent = '⏳ Saving...';
  try {
    const f = !p && $('f_file').files[0];
    if (f) { if (f.size > 5242880) throw new Error('File must be under 5 MB'); d.fileData = await b64(f); d.fileMime = f.type; d.fileName = f.name; }
    await api({action: id ? 'edit' : 'add', type, data: d}); hide(); toast('✅ Saved successfully'); load();
  } catch (e) { toast('❌ ' + e.message, true); b.disabled = false; b.textContent = '✔ Save'; }
}
async function del(type, id) {
  if (!confirm('Delete ' + id + '?')) return;
  try { await api({action: 'delete', type, id}); toast('🗑️ Deleted'); back(); load(); } catch (e) { toast('❌ ' + e.message, true); }
}

function userForm() {
  showSheet(`<div class="ph"><h2>👥 Add User</h2></div><div class="f"><label>User Name *</label><input id="un" autocapitalize="off"><label>Password *</label><input id="up" type="text" autocomplete="off">

async function userTog(i) { const u = ADM.users[i]; try { await api({action: 'userSave', name: u.name, role: u.role, active: !u.active}); u.active = !u.active; render(); } catch (e) { toast('❌ ' + e.message, true); } }

async function saveOpt() { try { await api({action: 'saveSettings', options: opt}); toast('✅ Settings saved'); } catch (e) { toast('❌ ' + e.message, true); } }
function optTog(k, i) { opt[k][i][1] = opt[k][i][1] ? 0 : 1; render(); saveOpt(); }
function optAdd(k) { const v = $('n_' + k).value.trim(); if (!v) return; if (opt[k].some(x => x[0].toLowerCase() === v.toLowerCase())) return toast('Already exists', true); opt[k].push([v, 1]); render(); saveOpt(); }


// ---------- background music (song.mp3 must be uploaded next to index.html) ----------
const bgm = $('bgm'); let musicOn = localStorage.getItem('bgm') !== 'off';
function musicUI() { const b = $('mus'); b.classList.toggle('on', musicOn && !bgm.paused); b.textContent = musicOn ? '🎶' : '🔇'; }
function playMusic() { if (!musicOn) return; try { const p = bgm.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
function toggleMusic() { musicOn = !musicOn; localStorage.setItem('bgm', musicOn ? 'on' : 'off'); if (musicOn) playMusic(); else bgm.pause(); musicUI(); toast(musicOn ? '🎶 Music on' : '🔇 Music off'); }
bgm.volume = 0.6; bgm.addEventListener('play', musicUI); bgm.addEventListener('pause', musicUI); bgm.addEventListener('error', () => { $('mus').style.display = 'none'; });
['pointerdown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, () => { if (musicOn && bgm.paused) playMusic(); }, {once: true, passive: true}));
musicUI(); playMusic(); // browsers block autoplay until the first tap, the listener above starts it then
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 30000);
document.addEventListener('visibilitychange', () => { if (document.hidden) bgm.pause(); else { lastDay = today(); load(); playMusic(); } });
render(); load();
</script>
